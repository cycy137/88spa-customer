<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🌟 核心 SEO 优化 1：标题直接切入 Redmond 本地关键词与核心业务 -->
    <title>88 Head Spa & Massage | Luxury Scalp Therapy & Massage in Redmond, WA</title>
    
    <!-- 🌟 核心 SEO 优化 2：利落的网页内容描述，吸引点击并塞满核心词 -->
    <meta name="description" content="Experience Redmond's premier Japanese head spa and therapeutic body massage. Located in Redmond, WA, 88 Spa offers certified scalp scaling, deep tissue massage, and premium organic relaxation sequences." />
    
    <!-- 🌟 核心 SEO 优化 3：本地化关键词堆栈 -->
    <meta name="keywords" content="head spa redmond, japanese head spa bellevue, massage redmond wa, scalp treatment redmond, deep tissue massage near me, 88 spa, 88 head spa" />
    
    <!-- 🌟 核心 SEO 优化 4：地理位置标签（强化 Google Maps 本地搜索权重） -->
    <meta name="geo.region" content="US-WA" />
    <meta name="geo.platplace" content="Redmond" />
    <meta name="ICBM" content="47.6740, -122.1215" />
    
    <!-- 🌟 核心 SEO 优化 5：Open Graph 社交分享卡片（Facebook、Text 转发时会显示精美大图） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="88 Head Spa & Massage | Luxury Relaxation in Redmond" />
    <meta property="og:description" content="Immerse yourself in our signature Japanese head spa treatments and professional full body therapies designed for ultimate restoration." />
    <meta property="og:url" content="https://88headspamassage.com" />
    <meta property="og:image" content="https://88headspamassage.comimages/spa-bg.jpg" />

    <!-- 字体预加载提升加载速度（这也是 SEO 加分项） -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
  </head>
  <body class="m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
